---
- name: "Scenario 06 - TTL set, update, and use_ttl gap observation"
  hosts: localhost
  connection: local
  vars_files:
    - vars/provider.yml

  tasks:
    - name: "PRE | Ensure zone ansible.test exists"
      infoblox.nios_modules.nios_zone:
        name: ansible.test
        view: default
        state: present
        provider: "{{ nios_provider }}"

    - name: "CLEANUP | Remove CNAME if leftover"
      infoblox.nios_modules.nios_cname_record:
        name: alias06.ansible.test
        canonical: target06.ansible.test
        view: default
        state: absent
        provider: "{{ nios_provider }}"

    - name: "TEST | Create CNAME without explicit TTL (inherits zone default)"
      infoblox.nios_modules.nios_cname_record:
        name: alias06.ansible.test
        canonical: target06.ansible.test
        view: default
        state: present
        provider: "{{ nios_provider }}"
      register: result_no_ttl

    - name: "ASSERT | Create without TTL reports changed"
      ansible.builtin.assert:
        that: result_no_ttl.changed
        success_msg: "PASS - create without TTL reported changed=true"
        fail_msg: "FAIL - create without TTL did not report changed"

    - name: "TEST | Set explicit TTL = 300"
      infoblox.nios_modules.nios_cname_record:
        name: alias06.ansible.test
        canonical: target06.ansible.test
        view: default
        ttl: 300
        state: present
        provider: "{{ nios_provider }}"
      register: result_set_ttl

    - name: "ASSERT | Setting TTL reports changed"
      ansible.builtin.assert:
        that: result_set_ttl.changed
        success_msg: "PASS - setting TTL reported changed=true"
        fail_msg: "FAIL - setting TTL did not report changed (use_ttl gap may be masking this)"

    - name: "TEST | Re-apply same TTL = 300 (idempotency)"
      infoblox.nios_modules.nios_cname_record:
        name: alias06.ansible.test
        canonical: target06.ansible.test
        view: default
        ttl: 300
        state: present
        provider: "{{ nios_provider }}"
      register: result_ttl_idempotent

    - name: "ASSERT | Re-applying same TTL is idempotent"
      ansible.builtin.assert:
        that: not result_ttl_idempotent.changed
        success_msg: "PASS - same TTL re-apply is idempotent"
        fail_msg: "FAIL - same TTL re-apply spuriously changed"

    - name: "TEST | Change TTL to different value 600"
      infoblox.nios_modules.nios_cname_record:
        name: alias06.ansible.test
        canonical: target06.ansible.test
        view: default
        ttl: 600
        state: present
        provider: "{{ nios_provider }}"
      register: result_change_ttl

    - name: "ASSERT | Changing TTL value reports changed"
      ansible.builtin.assert:
        that: result_change_ttl.changed
        success_msg: "PASS - TTL change reported changed=true"
        fail_msg: "FAIL - TTL change did not report changed"

    - name: "CLEANUP | Remove test CNAME"
      infoblox.nios_modules.nios_cname_record:
        name: alias06.ansible.test
        canonical: target06.ansible.test
        view: default
        state: absent
        provider: "{{ nios_provider }}"
