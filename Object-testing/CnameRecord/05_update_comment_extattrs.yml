---
- name: "Scenario 05 - Update comment and extattrs on existing CNAME"
  hosts: localhost
  connection: local
  vars_files:
    - vars/provider.yml

  tasks:
    - name: "PRE | Ensure zone ansible.test exists"
      infoblox.nios_modules.nios_zone:
        name: ansible.test
        view: default
        state: present
        provider: "{{ nios_provider }}"

    - name: "CLEANUP | Remove CNAME if leftover"
      infoblox.nios_modules.nios_cname_record:
        name: alias05.ansible.test
        canonical: target05.ansible.test
        view: default
        state: absent
        provider: "{{ nios_provider }}"

    - name: "TEST | Create CNAME with initial comment"
      infoblox.nios_modules.nios_cname_record:
        name: alias05.ansible.test
        canonical: target05.ansible.test
        view: default
        comment: "initial comment"
        extattrs:
          Site:
            value: "lab"
        state: present
        provider: "{{ nios_provider }}"
      register: result_create

    - name: "ASSERT | Create reports changed"
      ansible.builtin.assert:
        that: result_create.changed
        success_msg: "PASS - initial create reported changed=true"
        fail_msg: "FAIL - initial create did not report changed"

    - name: "TEST | Update comment and extattrs"
      infoblox.nios_modules.nios_cname_record:
        name: alias05.ansible.test
        canonical: target05.ansible.test
        view: default
        comment: "updated comment"
        extattrs:
          Site:
            value: "production"
        state: present
        provider: "{{ nios_provider }}"
      register: result_update

    - name: "ASSERT | Update reports changed"
      ansible.builtin.assert:
        that: result_update.changed
        success_msg: "PASS - comment/extattrs update reported changed=true"
        fail_msg: "FAIL - comment/extattrs update did not report changed"

    - name: "TEST | Re-apply same comment and extattrs (idempotency)"
      infoblox.nios_modules.nios_cname_record:
        name: alias05.ansible.test
        canonical: target05.ansible.test
        view: default
        comment: "updated comment"
        extattrs:
          Site:
            value: "production"
        state: present
        provider: "{{ nios_provider }}"
      register: result_idempotent

    - name: "ASSERT | Re-apply is idempotent"
      ansible.builtin.assert:
        that: not result_idempotent.changed
        success_msg: "PASS - re-apply of same comment/extattrs is idempotent"
        fail_msg: "FAIL - re-apply of same comment/extattrs spuriously changed"

    - name: "CLEANUP | Remove test CNAME"
      infoblox.nios_modules.nios_cname_record:
        name: alias05.ansible.test
        canonical: target05.ansible.test
        view: default
        state: absent
        provider: "{{ nios_provider }}"
