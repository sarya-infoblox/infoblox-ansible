# One-off sweep for an existing backlog: review every open issue and pull
# request RepoSherlock has not already commented on.
#
# Manual only. There is no schedule — this is what you run once after
# installing, not something that should wake up every morning.
#
# The single skip rule: a Bot comment whose body carries the RepoSherlock
# footer. Not labels, not age, not author. If RepoSherlock has not commented,
# it gets reviewed.

name: "📋 RepoSherlock Backlog Sweep"

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "What to process"
        required: true
        type: choice
        options:
          - both
          - issues-only
          - prs-only
        default: "both"
      delay_seconds:
        description: "Seconds between items (API rate limiting)"
        required: false
        type: number
        default: 3
      dry_run:
        description: "Preview only — list items without reviewing"
        required: false
        type: boolean
        default: false

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GEMINI_API_KEY
        if: inputs.dry_run == false
        shell: bash
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::GEMINI_API_KEY is not set. See .github/SETUP.md"
            exit 1
          fi
          echo "::notice::GEMINI_API_KEY is configured"

  sweep:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # continue-on-error so a service that will not start leaves the run
      # reporting what it could not do, rather than dying with no summary.
      - name: Start RepoSherlock
        if: inputs.dry_run == false
        id: sherlock
        continue-on-error: true
        uses: ./.github/actions/reposherlock
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ github.token }}

      # ─── Issues ───
      - name: Process open issues
        if: inputs.scope == 'both' || inputs.scope == 'issues-only'
        id: issues
        uses: actions/github-script@v7
        env:
          DELAY: ${{ inputs.delay_seconds }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHERLOCK_OK: ${{ steps.sherlock.outcome }}
        with:
          script: |
            const delay = parseInt(process.env.DELAY || '3', 10) * 1000;
            const dryRun = process.env.DRY_RUN === 'true';
            const sherlockOk = process.env.SHERLOCK_OK === 'success';

            // The footer is a markdown link. "Generated by RepoSherlock" is
            // NOT a substring of "Generated by [RepoSherlock](...)", so
            // matching the plain phrase would skip nothing and duplicate
            // every comment on a second run.
            const FOOTER = 'Generated by [RepoSherlock]';

            // Paginated: an issue past a hundred comments would otherwise
            // fail to find RepoSherlock's own and be reviewed again.
            async function alreadyReviewed(issue_number) {
              const all = await github.paginate(github.rest.issues.listComments,
                { ...context.repo, issue_number, per_page: 100 });
              return all.some(c => c.user && c.user.type === 'Bot'
                                && c.body && c.body.includes(FOOTER));
            }

            // Slugs as the endpoint returns them, not display names.
            const LABEL_FOR = {
              question: 'question',
              expected_behavior: 'question',
              bug: 'bug',
              feature_gap: 'enhancement',
              configuration_error: 'bug',
            };
            const QUESTION_KINDS = ['question', 'expected_behavior'];

            const all = await github.paginate(github.rest.issues.listForRepo,
              { ...context.repo, state: 'open', per_page: 100 });
            // listForRepo returns pull requests too; pull_request is the only
            // reliable way to tell them apart.
            const issues = all.filter(i => !i.pull_request);

            const stats = { total: issues.length, skipped: 0, reviewed: 0, failed: 0 };
            core.info(`Found ${issues.length} open issues`);

            for (const issue of issues) {
              if (await alreadyReviewed(issue.number)) {
                core.info(`#${issue.number}: already commented — skip`);
                stats.skipped++;
                continue;
              }
              if (dryRun) {
                core.info(`#${issue.number}: "${issue.title}" — would review`);
                stats.reviewed++;
                continue;
              }
              if (!sherlockOk) {
                core.warning(`#${issue.number}: RepoSherlock unavailable — skip`);
                stats.failed++;
                continue;
              }

              core.info(`#${issue.number}: reviewing "${issue.title}"`);
              try {
                const resp = await fetch('http://localhost:8000/github/answer-question', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ title: issue.title, body: issue.body || '' }),
                });
                if (!resp.ok) {
                  core.warning(`#${issue.number}: API returned ${resp.status}`);
                  stats.failed++;
                  continue;
                }
                const data = await resp.json();
                const comment = (data.comment_body || '').trim();
                const coverage = data.coverage || 'unknown';
                const classification = data.classification || 'bug';
                if (!comment) {
                  core.warning(`#${issue.number}: empty response`);
                  stats.failed++;
                  continue;
                }

                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number, body: comment });

                const existing = issue.labels.map(l => (l.name || l));
                const labels = [];
                const label = LABEL_FOR[classification] || 'bug';
                if (!existing.includes(label)) labels.push(label);

                // Only a fully covered question is actually resolved.
                if (QUESTION_KINDS.includes(classification) && coverage === 'fully_covered') {
                  labels.push('ai-answered');
                  await github.rest.issues.update({
                    ...context.repo, issue_number: issue.number,
                    state: 'closed', state_reason: 'completed' });
                  core.info(`#${issue.number}: answered and closed`);
                }

                if (labels.length) {
                  await github.rest.issues.addLabels({
                    ...context.repo, issue_number: issue.number, labels });
                }

                stats.reviewed++;
                core.info(`#${issue.number}: done (${classification}, ${coverage})`);
              } catch (err) {
                core.warning(`#${issue.number}: ${err.message}`);
                stats.failed++;
              }

              if (delay > 0) await new Promise(r => setTimeout(r, delay));
            }

            core.setOutput('stats', JSON.stringify(stats));
            core.info(`Issues done: ${stats.reviewed} reviewed, ${stats.skipped} skipped, ${stats.failed} failed`);

      # ─── Pull requests ───
      - name: Process open PRs
        if: inputs.scope == 'both' || inputs.scope == 'prs-only'
        id: prs
        uses: actions/github-script@v7
        env:
          DELAY: ${{ inputs.delay_seconds }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHERLOCK_OK: ${{ steps.sherlock.outcome }}
        with:
          script: |
            const delay = parseInt(process.env.DELAY || '3', 10) * 1000;
            const dryRun = process.env.DRY_RUN === 'true';
            const sherlockOk = process.env.SHERLOCK_OK === 'success';
            const FOOTER = 'Generated by [RepoSherlock]';

            async function alreadyReviewed(issue_number) {
              const all = await github.paginate(github.rest.issues.listComments,
                { ...context.repo, issue_number, per_page: 100 });
              return all.some(c => c.user && c.user.type === 'Bot'
                                && c.body && c.body.includes(FOOTER));
            }

            const prs = await github.paginate(github.rest.pulls.list,
              { ...context.repo, state: 'open', per_page: 100 });

            const stats = { total: prs.length, skipped: 0, reviewed: 0, failed: 0 };
            core.info(`Found ${prs.length} open PRs`);

            for (const pr of prs) {
              if (await alreadyReviewed(pr.number)) {
                core.info(`PR #${pr.number}: already commented — skip`);
                stats.skipped++;
                continue;
              }
              if (dryRun) {
                core.info(`PR #${pr.number}: "${pr.title}" — would review`);
                stats.reviewed++;
                continue;
              }
              if (!sherlockOk) {
                core.warning(`PR #${pr.number}: RepoSherlock unavailable — skip`);
                stats.failed++;
                continue;
              }

              core.info(`PR #${pr.number}: reviewing "${pr.title}"`);
              try {
                const resp = await fetch('http://localhost:8000/github/review-pr', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ url: pr.html_url }),
                });
                if (!resp.ok) {
                  core.warning(`PR #${pr.number}: API returned ${resp.status}`);
                  stats.failed++;
                  continue;
                }
                const data = await resp.json();
                const comment = (data.comment_body || '').trim();
                if (!comment) {
                  core.warning(`PR #${pr.number}: empty response`);
                  stats.failed++;
                  continue;
                }

                await github.rest.issues.createComment({
                  ...context.repo, issue_number: pr.number, body: comment });

                // A review that could not complete is not a reviewed PR.
                const failed = data.overall_result === 'REVIEW_FAILED';
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: pr.number,
                  labels: [failed ? 'needs-review' : 'sherlock-reviewed'] });

                stats.reviewed++;
                core.info(`PR #${pr.number}: done (${data.overall_result || 'reviewed'})`);
              } catch (err) {
                core.warning(`PR #${pr.number}: ${err.message}`);
                stats.failed++;
              }

              if (delay > 0) await new Promise(r => setTimeout(r, delay));
            }

            core.setOutput('stats', JSON.stringify(stats));
            core.info(`PRs done: ${stats.reviewed} reviewed, ${stats.skipped} skipped, ${stats.failed} failed`);

      - name: Summary
        if: always()
        uses: actions/github-script@v7
        env:
          ISSUE_STATS: ${{ steps.issues.outputs.stats }}
          PR_STATS: ${{ steps.prs.outputs.stats }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const parse = (raw) => { try { return JSON.parse(raw || '{}'); } catch { return {}; } };
            const is = parse(process.env.ISSUE_STATS);
            const ps = parse(process.env.PR_STATS);
            const dryRun = process.env.DRY_RUN === 'true';
            const verb = dryRun ? 'would be reviewed' : 'reviewed';

            const lines = [dryRun
              ? '## 📋 Backlog Sweep — dry run preview'
              : '## 📋 Backlog Sweep complete', ''];
            const row = (name, s) => `**${name}:** ${s.reviewed || 0} ${verb}, ` +
              `${s.skipped || 0} skipped` + (s.failed ? `, ${s.failed} failed` : '') +
              ` (${s.total} open)`;
            if (is.total !== undefined) lines.push(row('Issues', is));
            if (ps.total !== undefined) lines.push(row('PRs', ps));
            lines.push('', '---', '*Generated by RepoSherlock Backlog Sweep*');

            const summary = lines.join('\n');
            core.summary.addRaw(summary).write();
            core.info(summary);

      - name: Stop RepoSherlock
        if: always() && steps.sherlock.outcome == 'success'
        shell: bash
        run: |
          docker rm -f sherlock-app sherlock-qdrant 2>/dev/null || true
          docker network rm sherlock-net 2>/dev/null || true
          docker compose -f docker-compose.ci.yml down -v 2>/dev/null || true
          docker compose down -v 2>/dev/null || true
