# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# RepoSherlock — Setup (reusable workflow)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# What this does:
#   Builds the RepoSherlock image, starts it alongside Qdrant on the runner,
#   waits until /health answers, and indexes every document in the docs
#   folder so the Doc Assistant can answer from them. Other workflows call
#   this instead of repeating the setup.
#
# Required secrets:
#   GEMINI_API_KEY — Google Gemini API key
#
# Optional secrets:
#   none
#
# Configuration:
#   .github/maintainers.yml — see .github/maintainers.yml.template
#
# Setup guide: .github/SETUP.md
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#
# Called from another workflow like this:
#
#   jobs:
#     reposherlock:
#       uses: ./.github/workflows/reposherlock-setup.yml
#       secrets:
#         GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
#
# NOTE ON SCOPE: a called workflow runs as its own job on its own runner, so
# the service it starts is gone when that job ends. Steps that need to query
# RepoSherlock must run inside this workflow, or this file should be turned
# into a composite action so it runs in the caller's job. The indexing summary
# below is emitted here for that reason.

name: "RepoSherlock Setup"

on:
  workflow_call:
    inputs:
      docs_path:
        description: "Path to documentation folder to auto-index"
        required: false
        default: "docs"
        type: string
      gemini_model:
        description: "Gemini model id"
        required: false
        default: "gemini-3.5-flash-lite"
        type: string
    secrets:
      GEMINI_API_KEY:
        required: true
    outputs:
      reposherlock_url:
        description: "Base URL of the running RepoSherlock instance"
        value: ${{ jobs.start-reposherlock.outputs.url }}
      documents_indexed:
        description: "How many documents were uploaded and indexed"
        value: ${{ jobs.start-reposherlock.outputs.indexed }}

jobs:
  start-reposherlock:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.health.outputs.url }}
      indexed: ${{ steps.index.outputs.indexed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build from the repo root.
      - name: Build RepoSherlock image
        run: docker compose -f docker-compose.ci.yml build app

      # --wait blocks on the healthchecks in docker-compose.ci.yml, so this
      # step only returns once the embedding model has finished loading.
      - name: Start RepoSherlock and Qdrant
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          GITHUB_TOKEN: ${{ github.token }}
        run: docker compose -f docker-compose.ci.yml up -d --wait

      - name: Wait for /health
        id: health
        run: |
          set -euo pipefail
          # --wait above should already guarantee this; the retry is a second
          # line of defence so a failure here is a clear message rather than a
          # confusing error from whatever step runs next.
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 5 http://localhost:8000/health > /tmp/health.json; then
              echo "healthy after ${attempt} attempt(s): $(cat /tmp/health.json)"
              echo "url=http://localhost:8000" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "::error::RepoSherlock did not become healthy within 120s"
          docker compose -f docker-compose.ci.yml logs --tail 80
          exit 1

      - name: Index documentation
        id: index
        env:
          DOCS_PATH: ${{ inputs.docs_path }}
        run: |
          set -euo pipefail
          count=0
          if [ -d "$DOCS_PATH" ]; then
            # Only the extensions the upload endpoint accepts; anything else
            # would come back as a 400 and fail the run for no good reason.
            while IFS= read -r -d '' file; do
              name=$(basename "$file")
              if curl -fsS --max-time 180 -X POST http://localhost:8000/docs/upload \
                   -F "file=@${file}" > /tmp/upload.json; then
                echo "indexed: ${name} -> $(cat /tmp/upload.json)"
                count=$((count + 1))
              else
                echo "::warning::failed to index ${name}"
              fi
            done < <(find "$DOCS_PATH" -type f \
                       \( -iname '*.pdf' -o -iname '*.md' -o -iname '*.txt' -o -iname '*.log' \) \
                       ! -iname 'README.md' -print0)
          else
            echo "::notice::no docs folder at ${DOCS_PATH}; skipping indexing"
          fi
          echo "indexed=${count}" >> "$GITHUB_OUTPUT"
          echo "### RepoSherlock ready" >> "$GITHUB_STEP_SUMMARY"
          echo "- documents indexed: ${count}" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS --max-time 30 http://localhost:8000/docs/status \
            >> "$GITHUB_STEP_SUMMARY" || true

      # Always dump logs on failure: without them a red run says only that a
      # curl exited non-zero.
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --tail 200

      - name: Stop RepoSherlock
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
